<!--
  EmailJS notification template — the mail Joseph receives when the contact
  form is submitted. This file is the source of truth; paste it into the
  EmailJS dashboard (Email Templates -> Contact Us -> Edit Content -> HTML)
  whenever it changes, since the dashboard copy is not version-controlled.

  Placeholders come from src/components/Contact.astro:
    {{name}} {{email}} {{message}}  - the three real form fields
    {{time}}                        - injected by the alias map on submit

  Email-client constraints this file deliberately respects:
    - table layout + inline CSS (Outlook renders with the Word engine)
    - no external fonts or images (blocked or stripped nearly everywhere)
    - the outer wrapper is transparent, so the card sits on the client's own
      background instead of painting a dark slab across the reading pane
    - padding on <td>, never on <a>, so the button survives Outlook
    - white-space:pre-wrap on the message so the sender's line breaks live
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0;padding:0;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:0;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#10160E" style="width:100%;max-width:600px;background:#10160E;border:1px solid #1E3A26;border-collapse:collapse;">

        <!-- title bar -->
        <tr>
          <td style="padding:14px 22px;border-bottom:1px solid #1E3A26;font-family:'Courier New',Courier,monospace;font-size:13px;color:#6FAE7E;">
            ~/joseph&nbsp;$ <span style="color:#00FF41;">./inbox --new</span>
          </td>
        </tr>

        <!-- heading -->
        <tr>
          <td style="padding:26px 22px 6px;font-family:'Courier New',Courier,monospace;">
            <div style="font-size:22px;line-height:1.3;color:#00FF41;font-weight:bold;">New message from {{name}}</div>
            <div style="font-size:12px;line-height:1.6;color:#6FAE7E;padding-top:6px;">via the contact form on josephk.dev</div>
          </td>
        </tr>

        <!-- metadata -->
        <tr>
          <td style="padding:18px 22px 0;font-family:'Courier New',Courier,monospace;font-size:14px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td width="70" valign="top" style="padding:4px 0;color:#6FAE7E;">name</td>
                <td valign="top" style="padding:4px 0;color:#9DFFB0;">{{name}}</td>
              </tr>
              <tr>
                <td width="70" valign="top" style="padding:4px 0;color:#6FAE7E;">email</td>
                <td valign="top" style="padding:4px 0;">
                  <a href="mailto:{{email}}" style="color:#FFB000;text-decoration:none;">{{email}}</a>
                </td>
              </tr>
              <tr>
                <td width="70" valign="top" style="padding:4px 0;color:#6FAE7E;">time</td>
                <td valign="top" style="padding:4px 0;color:#9DFFB0;">{{time}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- message body -->
        <tr>
          <td style="padding:22px 22px 0;font-family:'Courier New',Courier,monospace;">
            <div style="font-size:12px;color:#6FAE7E;padding-bottom:8px;">--- message ---</div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0A0E0A" style="background:#0A0E0A;border:1px solid #1E3A26;border-collapse:collapse;">
              <tr>
                <td style="padding:16px 18px;font-family:'Courier New',Courier,monospace;font-size:15px;line-height:1.7;color:#9DFFB0;white-space:pre-wrap;word-break:break-word;">{{message}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- reply button -->
        <tr>
          <td style="padding:24px 22px 4px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td bgcolor="#10160E" style="border:1px solid #FFB000;padding:11px 22px;">
                  <a href="mailto:{{email}}?subject=Re:%20your%20message%20via%20josephk.dev"
                     style="font-family:'Courier New',Courier,monospace;font-size:14px;color:#FFB000;text-decoration:none;display:inline-block;">
                    reply to {{name}} &rarr;
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td style="padding:22px;font-family:'Courier New',Courier,monospace;font-size:11px;line-height:1.7;color:#6FAE7E;">
            <div style="border-top:1px solid #1E3A26;padding-top:14px;">
              Sent automatically by the contact form at
              <a href="https://josephk.dev" style="color:#FFB000;text-decoration:none;">josephk.dev</a>.
              Replying goes straight to the sender.
            </div>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
